name: CI

on:
  push:
    branches: [main]
  pull_request:

# A phase is not complete until this workflow is green (non-negotiable #4).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only values. Real keys never enter CI; the fixtures below only need to
  # satisfy the boot-time schema, never to reach a provider.
  DATABASE_URL: postgres://verdict:verdict@localhost:5432/verdict
  REDIS_URL: redis://localhost:6379
  ANTHROPIC_API_KEY: sk-ant-ci-not-a-real-key
  COST_CAP_USD_PER_DAY: "1.00"

jobs:
  typescript:
    name: TypeScript (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @verdict/shared build

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

  python:
    name: Python (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/evald
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Check formatting
        run: ruff format --check src tests

      - name: Typecheck
        run: mypy src tests

      - name: Test
        run: pytest -q

  schema:
    name: Database migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: verdict
          POSTGRES_PASSWORD: verdict
          POSTGRES_DB: verdict
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U verdict -d verdict"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations
        env:
          PGPASSWORD: verdict
        run: |
          for f in db/migrations/*.sql; do
            echo "applying $f"
            psql -h localhost -U verdict -d verdict -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Re-apply to prove migrations are idempotent
        env:
          PGPASSWORD: verdict
        run: |
          for f in db/migrations/*.sql; do
            psql -h localhost -U verdict -d verdict -v ON_ERROR_STOP=1 -f "$f"
          done

  docker:
    name: docker compose up from a clean clone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 300
        env:
          ANTHROPIC_API_KEY: sk-ant-ci-not-a-real-key

      - name: Gateway and evald answer health checks
        run: |
          curl -fsS http://localhost:8080/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:3000 > /dev/null

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
