# Migrate on green main.
#
# Railway and Vercel both deploy themselves when this repo is pushed — each has
# its own GitHub integration. This workflow does the two things neither platform
# does: run the full test suite, and apply database migrations.
#
# It used to deploy as well, via the Railway and Vercel CLIs. That duplicated
# what the integrations were already doing, needed two more tokens, and failed
# on token scope. Deleted rather than debugged: a second way to deploy is a
# second thing that can disagree with the first (D-066).
#
# The migrate job is gated on its secret existing, so this stays green before
# the database is configured rather than painting main red for a step that was
# never set up.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One at a time. Two pushes mid-migration would race two schema changes
  # against one database.
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Which targets are configured?
    runs-on: ubuntu-latest
    outputs:
      neon: ${{ steps.check.outputs.neon }}
    steps:
      - id: check
        env:
          NEON: ${{ secrets.DATABASE_URL }}
        run: |
          have() { [ -n "$1" ] && echo "true" || echo "false"; }
          echo "neon=$(have "$NEON")" >> "$GITHUB_OUTPUT"
          {
            echo "### Targets"
            echo "| target | configured |"
            echo "| --- | --- |"
            echo "| Neon (migrations) | $(have "$NEON") |"
            echo ""
            echo "Railway and Vercel deploy via their own GitHub integrations."
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @verdict/shared build && pnpm --filter @verdict/ghapp build
      - run: pnpm lint
      - run: pnpm format:check
      - run: python3 tools/verify-readme.py
      - run: pnpm -r typecheck
      - run: pnpm -r test

      - name: Python
        working-directory: apps/evald
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e '.[dev]'
          .venv/bin/python -m ruff check src tests
          .venv/bin/python -m ruff format --check src tests
          .venv/bin/python -m mypy src tests
          .venv/bin/python -m pytest -q

  migrate:
    name: Migrate Neon
    needs: [preflight, test]
    if: needs.preflight.outputs.neon == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # The same script docker compose and CI use. One migration path.
        run: ./tools/migrate.sh

  verify:
    name: Verify the live gateway
    needs: [migrate]
    # `always()` so a skipped migrate does not cascade; a FAILED one still blocks.
    if: always() && needs.migrate.result != 'failure' && vars.GATEWAY_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Poll /health
        env:
          RAW_URL: ${{ vars.GATEWAY_URL }}
        # Railway deploys on its own schedule, so this waits rather than
        # checking once: a deploy that reports success while the service 503s
        # is not a success, and that is the failure this whole phase kept
        # producing (D-062, D-064, D-065).
        run: |
          # GATEWAY_URL is typed by a human into a web form. Accept the three
          # shapes a person actually pastes -- with a trailing slash, or with
          # /health already on the end -- rather than turning either into a
          # ten-minute timeout. D-067.
          URL="${RAW_URL%/}"
          URL="${URL%/health}"
          URL="${URL%/}"
          echo "polling ${URL}/health"

          for i in $(seq 1 40); do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 10 "$URL/health" || echo "000")
            case "$code" in
              200)
                echo "healthy after ${i} attempt(s)"
                cat /tmp/body; echo
                exit 0
                ;;
              000|502|503|504)
                # Not up YET: connection refused, or the platform's own
                # "still starting" page. Worth waiting for.
                ;;
              *)
                # Any other HTTP response means something IS listening and it
                # does not serve /health -- the URL is wrong, and no amount of
                # waiting fixes a wrong URL. Fail now, and say so.
                echo "::error::$URL/health returned HTTP $code. The service is reachable but that is not the health endpoint -- check the GATEWAY_URL repository variable." >&2
                head -c 300 /tmp/body >&2; echo >&2
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::gateway never became healthy at $URL/health after 10 minutes" >&2
          exit 1
