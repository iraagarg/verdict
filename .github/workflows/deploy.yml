# Migrate on green main.
#
# Railway and Vercel both deploy themselves when this repo is pushed — each has
# its own GitHub integration. This workflow does the two things neither platform
# does: run the full test suite, and apply database migrations.
#
# It used to deploy as well, via the Railway and Vercel CLIs. That duplicated
# what the integrations were already doing, needed two more tokens, and failed
# on token scope. Deleted rather than debugged: a second way to deploy is a
# second thing that can disagree with the first (D-066).
#
# The migrate job is gated on its secret existing, so this stays green before
# the database is configured rather than painting main red for a step that was
# never set up.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One at a time. Two pushes mid-migration would race two schema changes
  # against one database.
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Which targets are configured?
    runs-on: ubuntu-latest
    outputs:
      neon: ${{ steps.check.outputs.neon }}
    steps:
      - id: check
        env:
          NEON: ${{ secrets.DATABASE_URL }}
        run: |
          have() { [ -n "$1" ] && echo "true" || echo "false"; }
          echo "neon=$(have "$NEON")" >> "$GITHUB_OUTPUT"
          {
            echo "### Targets"
            echo "| target | configured |"
            echo "| --- | --- |"
            echo "| Neon (migrations) | $(have "$NEON") |"
            echo ""
            echo "Railway and Vercel deploy via their own GitHub integrations."
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @verdict/shared build && pnpm --filter @verdict/ghapp build
      - run: pnpm lint
      - run: pnpm format:check
      - run: python3 tools/verify-readme.py
      - run: pnpm -r typecheck
      - run: pnpm -r test

      - name: Python
        working-directory: apps/evald
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e '.[dev]'
          .venv/bin/python -m ruff check src tests
          .venv/bin/python -m ruff format --check src tests
          .venv/bin/python -m mypy src tests
          .venv/bin/python -m pytest -q

  migrate:
    name: Migrate Neon
    needs: [preflight, test]
    if: needs.preflight.outputs.neon == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # The same script docker compose and CI use. One migration path.
        run: ./tools/migrate.sh

  verify:
    name: Verify the live gateway
    needs: [migrate]
    # `always()` so a skipped migrate does not cascade; a FAILED one still blocks.
    if: always() && needs.migrate.result != 'failure' && vars.GATEWAY_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Poll /health
        env:
          RAW_URL: ${{ vars.GATEWAY_URL }}
        # Railway deploys on its own schedule, so this waits rather than
        # checking once: a deploy that reports success while the service 503s
        # is not a success, and that is the failure this whole phase kept
        # producing (D-062, D-064, D-065).
        run: |
          # GATEWAY_URL is typed by a human into a web form, so it is input and
          # gets normalised at the boundary like any other (D-067).
          #
          # Strip ALL whitespace first, not just a trailing slash: a variable
          # pasted into a web form arrives carrying a trailing newline, which
          # produced the URL "https://host\n/health" and a connection failure
          # that read as a wrong endpoint. Then drop a trailing slash and a
          # trailing /health, which are the other two shapes people paste.
          URL=$(printf '%s' "$RAW_URL" | tr -d '[:space:]')
          URL="${URL%/}"; URL="${URL%/health}"; URL="${URL%/}"

          if [ -z "$URL" ]; then
            echo "::error::GATEWAY_URL is set but empty after trimming whitespace." >&2
            exit 1
          fi
          echo "polling ${URL}/health"

          for i in $(seq 1 40); do
            : > /tmp/body
            # `|| code=000` rather than `|| echo 000`: inside a command
            # substitution the echo is APPENDED to what curl already printed,
            # which turned 000 into 000000 and matched no case at all.
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 10 "$URL/health") || code="000"

            case "$code" in
              200)
                echo "healthy after ${i} attempt(s)"
                cat /tmp/body; echo
                exit 0
                ;;
              000)
                # No HTTP response: DNS failure, connection refused, timeout, or
                # a malformed URL. Early on this is a service still starting, so
                # keep waiting -- but say so, because a URL that is simply wrong
                # looks identical and would otherwise be silent for ten minutes.
                echo "  attempt ${i}: no response from ${URL}/health (not up yet, or the URL is wrong)"
                ;;
              502|503|504)
                echo "  attempt ${i}: HTTP ${code} — platform says still starting"
                ;;
              *)
                # A definite HTTP answer that is not 200 means something IS
                # listening and does not serve /health. Waiting cannot fix a
                # wrong path, so fail now.
                echo "::error::${URL}/health returned HTTP ${code}. Something is listening there but it is not the gateway's health endpoint — check the GATEWAY_URL repository variable." >&2
                head -c 300 /tmp/body >&2 || true; echo >&2
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::${URL}/health never answered 200 in 10 minutes. If every attempt above said 'no response', the URL is probably wrong rather than the service being down." >&2
          exit 1
