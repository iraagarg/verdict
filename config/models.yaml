# ─────────────────────────────────────────────────────────────────────────────
# Verdict model ladder and cost configuration.
#
# RULES (enforced by the schema in packages/shared/src/config/models.ts):
#   1. Prices are USD per MILLION tokens. Never inline in code.
#   2. Every `pricing` block MUST carry `verified_at` and `source`. A price with
#      no provenance fails validation and the process refuses to start.
#      This is non-negotiable #1 applied to numbers, not just to benchmarks.
#   3. `null` means "not yet verified" and is NOT the same as zero. Any cost
#      calculation that needs a null field must fail loudly, never assume 0.
#   4. Model IDs are exact. Current Claude IDs carry NO date suffix.
#   5. Every price must be an exact multiple of $0.001/MTok, so the cost meter
#      can work in integer nano-USD per token and never touch floating point.
#
# Anthropic cache pricing follows the documented multipliers: a 5-minute cache
# write is 1.25x base input, a cache read is 0.10x base input.
#
# Groq's Llama models are listed as "Enterprise — contact sales" with no public
# per-token price, so they are NOT in this ladder. A rung without a published
# price cannot be in a cost comparison.
# ─────────────────────────────────────────────────────────────────────────────

version: 1

# Embedding model for route clustering and the semantic cache.
# Chosen in P2; `dimensions` is a migration-breaking constant (DECISIONS.md D-015).
embedding:
  model: null
  dimensions: null

# The rung a request falls back to whenever there is no positive evidence that
# something cheaper is safe: no policy, out-of-distribution prompt, breaker open,
# insufficient sample size. DESIGN.md §8.2 — the router fails toward quality.
safe_default: claude-opus-5

# The frozen reference outputs every pairwise judgment compares against.
# DECISIONS.md D-003.
reference_model: claude-opus-5

models:
  # ── cheap ───────────────────────────────────────────────────────────────────
  gpt-5-nano:
    provider: openai
    rung: cheap
    context_window: 400000
    max_output_tokens: 128000
    pricing:
      input: 0.05
      output: 0.40
      cache_read: null # TBD — OpenAI cached-input pricing not yet verified
      cache_write: null
      verified_at: "2026-09-14"
      source: "https://developers.openai.com/api/docs/pricing"
    capabilities:
      supports_sampling_params: true
      supports_effort: false
      thinking_mode: none
      supports_prefill: false

  openai/gpt-oss-20b:
    provider: groq
    rung: cheap
    context_window: 131072
    max_output_tokens: 32768
    pricing:
      input: 0.075
      output: 0.30
      cache_read: null # Groq does not publish a cached-input rate
      cache_write: null
      verified_at: "2026-09-14"
      source: "https://console.groq.com/docs/models"
    capabilities:
      supports_sampling_params: true
      supports_effort: false
      thinking_mode: none
      supports_prefill: false

  openai/gpt-oss-120b:
    provider: groq
    rung: cheap
    context_window: 131072
    max_output_tokens: 32768
    pricing:
      input: 0.15
      output: 0.60
      cache_read: null
      cache_write: null
      verified_at: "2026-09-14"
      source: "https://console.groq.com/docs/models"
    capabilities:
      supports_sampling_params: true
      supports_effort: false
      thinking_mode: none
      supports_prefill: false

  claude-haiku-4-5:
    provider: anthropic
    rung: cheap
    context_window: 200000
    max_output_tokens: 64000
    pricing:
      input: 1.00
      output: 5.00
      cache_read: 0.10 # 0.10x base input
      cache_write: 1.25 # 1.25x base input (5-minute)
      verified_at: "2026-09-14"
      source: "https://platform.claude.com/docs/en/about-claude/pricing"
    capabilities:
      supports_sampling_params: true # temperature / top_p accepted
      supports_effort: false # output_config.effort errors on this model
      thinking_mode: budget_tokens # {type:"enabled", budget_tokens:N}
      supports_prefill: true

  # ── mid ─────────────────────────────────────────────────────────────────────
  gpt-5:
    provider: openai
    rung: mid
    context_window: 400000
    max_output_tokens: 128000
    pricing:
      input: 1.25
      output: 10.00
      cache_read: null
      cache_write: null
      verified_at: "2026-09-14"
      source: "https://developers.openai.com/api/docs/pricing"
    capabilities:
      supports_sampling_params: true
      supports_effort: false
      thinking_mode: none
      supports_prefill: false

  claude-sonnet-5:
    provider: anthropic
    rung: mid
    context_window: 1000000
    max_output_tokens: 128000
    pricing:
      input: 2.00
      output: 10.00
      cache_read: 0.20 # 0.10x base input
      cache_write: 2.50 # 1.25x base input (5-minute)
      verified_at: "2026-09-14"
      source: "https://platform.claude.com/docs/en/about-claude/pricing"
    capabilities:
      supports_sampling_params: false # temperature / top_p return HTTP 400
      supports_effort: true
      thinking_mode: adaptive # budget_tokens returns HTTP 400
      supports_prefill: false

  # ── strong ──────────────────────────────────────────────────────────────────
  claude-opus-5:
    provider: anthropic
    rung: strong
    context_window: 1000000
    max_output_tokens: 128000
    pricing:
      input: 5.00
      output: 25.00
      cache_read: 0.50 # 0.10x base input
      cache_write: 6.25 # 1.25x base input (5-minute)
      verified_at: "2026-09-14"
      source: "https://platform.claude.com/docs/en/about-claude/pricing"
    capabilities:
      supports_sampling_params: false # temperature / top_p return HTTP 400
      supports_effort: true
      thinking_mode: adaptive # budget_tokens returns HTTP 400
      supports_prefill: false
